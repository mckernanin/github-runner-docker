name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: runner
        run: |
          v=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name | ltrimstr("v")')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: RUNNER_VERSION=${{ steps.runner.outputs.version }}
          tags: gh-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # pnpm/action-setup installs @pnpm/exe through npm using the PATH node,
      # so a too-old node here breaks consumer jobs rather than this build.
      - name: smoke test
        run: |
          docker run --rm --entrypoint bash gh-runner:test -c '
            set -e
            node --version
            npm --version
            cd "$(mktemp -d)"
            # Let npm run the @pnpm/exe install script as action-setup does; the script
            # name changed in pnpm 12 (setup.js -> install.js), so never call it directly.
            echo "{\"private\":true,\"allowScripts\":{\"@pnpm/exe\":true}}" > package.json
            npm install --no-audit --no-fund @pnpm/exe@latest >/dev/null
            ./node_modules/.bin/pnpm --version
            # rustc shells out to cc for every link, so linking must work, not just cc --version.
            printf "int main(void){return 0;}" > t.c
            cc t.c -o t && ./t
          '

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: RUNNER_VERSION=${{ steps.runner.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.runner.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Lets `docker inspect` on a container deployed by :latest name its commit.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.event_name != 'pull_request'
        run: |
          {
            echo "    ghcr.io/${{ github.repository }}:${{ github.sha }}"
            echo "    ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
